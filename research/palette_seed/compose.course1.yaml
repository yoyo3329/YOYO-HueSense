name: huesense-seed-course1
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HUESENSE_SEED_ROOT_PASSWORD:?Set root password}
      MYSQL_DATABASE: huesense_seed
      MYSQL_USER: huesense_seed
      MYSQL_PASSWORD: ${HUESENSE_DB_PASSWORD:?Set app password}
    ports:
      - "127.0.0.1:${HUESENSE_SEED_MYSQL_PORT:-3307}:3306"
    volumes:
      - seed_mysql_data:/var/lib/mysql
      - ./sql/001_palette_seed.sql:/docker-entrypoint-initdb.d/001_palette_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  seed-import:
    build:
      context: .
      dockerfile: docker/Dockerfile.course1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HUESENSE_DB_PASSWORD: ${HUESENSE_DB_PASSWORD:?Set app password}
    command: ["python", "scripts/import_palette_seeds.py", "--host", "mysql", "--port", "3306", "--user", "huesense_seed", "--database", "huesense_seed"]
    restart: "no"
  seed-query:
    build:
      context: .
      dockerfile: docker/Dockerfile.course1
    profiles: ["query"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HUESENSE_DB_PASSWORD: ${HUESENSE_DB_PASSWORD:?Set app password}
      HUESENSE_DB_HOST: mysql
      HUESENSE_DB_PORT: "3306"
      HUESENSE_DB_USER: huesense_seed
      HUESENSE_DB_NAME: huesense_seed
    entrypoint: ["python", "scripts/query_palette_seeds.py"]
  adminer:
    image: adminer:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HUESENSE_SEED_ADMINER_PORT:-8082}:8080"
    restart: unless-stopped
volumes:
  seed_mysql_data:
