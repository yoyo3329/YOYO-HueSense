<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#243047;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{background:#161f36;color:white;padding:22px max(22px,calc((100vw - 1160px)/2));}header h1{font-size:26px;margin:0 0 8px}header p{opacity:.8;margin:0}main{max-width:1160px;margin:auto;padding:22px} .statline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0 24px}.stat{background:white;padding:16px;border-radius:12px;border:1px solid #e2e5ec}.stat strong{display:block;font-size:25px;color:#192c50}.stat span{font-size:12px;color:#6a7589}.toolbar{display:flex;flex-wrap:wrap;gap:9px;padding:16px;background:white;border:1px solid #e0e5ee;border-radius:14px;margin-bottom:16px}input,select,button{font:inherit;padding:10px 12px;border:1px solid #cad1df;border-radius:9px;background:white;color:inherit}input{flex:1;min-width:210px}button{cursor:pointer}button:hover{background:#eef3ff}.primary{background:#304fa3;color:#fff;border-color:#304fa3}.primary:hover{background:#243d7e}.notice{font-size:13px;color:#667188;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}.card{background:white;border:1px solid #e0e4ee;border-radius:14px;padding:14px;min-width:0}.card h3{font-size:16px;margin:0 0 5px}.meta{color:#6e798d;font-size:12px;margin-bottom:13px;overflow-wrap:anywhere}.swatches{display:flex;height:85px;gap:3px;border-radius:9px;overflow:hidden}.swatches>div{flex:1;cursor:pointer}.swatches>div:hover{outline:3px solid #fff;outline-offset:-4px}.chips{display:flex;gap:5px;margin:9px 0;flex-wrap:wrap}.chips code{font-size:10px;background:#f1f3f8;border-radius:4px;padding:3px 4px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1;font-size:12px}.hidden{display:none}dialog{border:1px solid #cfd5e3;border-radius:17px;padding:0;width:min(650px,94vw);max-height:88vh;box-shadow:0 20px 90px #1b2a4a44}dialog::backdrop{background:#10162999}.dialogbody{padding:24px}.close{float:right}.detailrow{display:grid;grid-template-columns:75px 1fr 106px;align-items:center;gap:10px;padding:6px 0}.colorblock{height:33px;border-radius:7px;border:1px solid #0001}.kv{border-top:1px solid #e3e7f0;padding:10px 0;overflow-wrap:anywhere;font-size:13px}.kv span{color:#647087}a{color:#3152ac}footer{font-size:12px;color:#6d7990;padding:25px 0} .warning{background:#fff8e7;border:1px solid #f0ddb1;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:15px}.success{color:#18794e}.fail{color:#b42318}@media(max-width:580px){.statline{grid-template-columns:repeat(2,1fr)}main{padding:14px}.swatches{height:72px}}
</style></head><body>
<header><h1>HueSense <span style="font-weight:400;opacity:.76">/ Palette Seed Lab</span></h1><p>課程 1｜五色種子搜尋・資料完整性檢查・來源追溯</p></header>
<main><div class="statline"><div class="stat"><strong id="statPalettes"></strong><span>五色原始組合</span></div><div class="stat"><strong id="statColors"></strong><span>不重複 HEX</span></div><div class="stat"><strong id="statLinks"></strong><span>色票成員紀錄</span></div><div class="stat"><strong id="statVisible"></strong><span>篩選結果</span></div></div>
<div class="warning"><b>研究範圍：</b>這是 GitHub 原始 JSON 的離線可操作預覽。不是 MySQL 即時查詢；原始色票順序不是品牌角色，也沒有心理情感分數。資料來源為製圖配色。</div>
<div class="toolbar"><input id="search" aria-label="搜尋" placeholder="搜尋名稱或種子 ID，例如 Peach、Blues"><select id="source"><option value="">所有來源</option><option value="colorbrewer">ColorBrewer</option><option value="carto">CARTOColors</option></select><select id="family"><option value="">所有類型</option></select><button id="testBtn">執行資料測試</button><button id="exportBtn">匯出目前結果 JSON</button><button id="clearBtn">重設</button></div><div class="notice" id="notice" role="status"></div><section class="cards" id="cards"></section>
<div class="hidden" id="testResults"></div><footer>HueSense 課程 1 ・資料來源的原始 GitHub commit、授權與原始五色順序請見各配色詳情。使用者的正式 Docker／MySQL 驗收尚未執行。</footer></main>

<script>
const DB=JSON.parse(document.getElementById('seed-data').textContent);
const $=id=>document.getElementById(id);
const unique=new Set(DB.palettes.flatMap(p=>p.colors));
$('statPalettes').textContent=DB.palettes.length;
$('statColors').textContent=unique.size;
$('statLinks').textContent=DB.palettes.reduce((n,p)=>n+p.colors.length,0);
const families=[...new Set(DB.palettes.map(p=>p.family))].sort();
for(const f of families){let o=document.createElement('option');o.value=f;o.textContent=f;$('family').appendChild(o)}
let filtered=[];
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>notify('已複製到剪貼簿')).catch(()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify('已複製')})}
function notify(t){$('notice').textContent=t}
function runFilter(){const q=$('search').value.trim().toLowerCase(),s=$('source').value,f=$('family').value;filtered=DB.palettes.filter(p=>(!q||(p.name+' '+p.id).toLowerCase().includes(q))&&(!s||p.source===s)&&(!f||p.family===f));$('statVisible').textContent=filtered.length;$('cards').replaceChildren();for(const p of filtered){const card=el('article',undefined,'card');card.appendChild(el('h3',p.name));card.appendChild(el('div',p.id+' · '+p.family,'meta'));const bar=el('div',undefined,'swatches');for(const c of p.colors){const v=el('div');v.style.backgroundColor=c;v.title='複製 '+c;v.onclick=()=>copyText(c);bar.appendChild(v)}card.appendChild(bar);const chips=el('div',undefined,'chips');for(const c of p.colors)chips.appendChild(el('code',c));card.appendChild(chips);const actions=el('div',undefined,'actions'),detail=el('button','查看資料'),copy=el('button','複製五色');detail.onclick=()=>showDetail(p);copy.onclick=()=>copyText(p.colors.join(', '));actions.append(detail,copy);card.appendChild(actions);$('cards').appendChild(card)}notify('顯示 '+filtered.length+' / '+DB.palettes.length+' 組五色；點擊單一色塊即可複製 HEX。')}
function addKV(into,label,value){const v=el('div',undefined,'kv');v.appendChild(el('span',label+'：'));v.appendChild(el('strong',String(value)));into.appendChild(v)}
function showDetail(p){$('detailTitle').textContent=p.name+'｜'+p.id;const parent=$('detailContent');parent.replaceChildren();for(let i=0;i<5;i++){const row=el('div',undefined,'detailrow');row.appendChild(el('strong','色票 '+(i+1)));const block=el('div',undefined,'colorblock');block.style.backgroundColor=p.colors[i];row.appendChild(block);const copy=el('button',p.colors[i]);copy.onclick=()=>copyText(p.colors[i]);row.appendChild(copy);parent.appendChild(row)}const source=DB.sources[p.source];addKV(parent,'原始類型',p.family);addKV(parent,'GitHub 來源',source.url);addKV(parent,'原始資料路徑',source.source_path);addKV(parent,'固定來源版本',source.commit);addKV(parent,'授權描述',source.license);addKV(parent,'研究狀態','原始五色／無品牌角色／無心理語意驗證');const b=el('button','複製完整 JSON','primary');b.onclick=()=>copyText(JSON.stringify(p,null,2));parent.appendChild(b);$('detail').showModal()}
$('closeBtn').onclick=()=>$('detail').close();
function test(){let failures=[];const ids=new Set();for(const p of DB.palettes){if(ids.has(p.id))failures.push('重複 ID '+p.id);ids.add(p.id);if(!DB.sources[p.source])failures.push('缺來源 '+p.id);if(p.colors.length!==5||new Set(p.colors).size!==5||p.colors.some(c=>!/^#[0-9A-F]{6}$/.test(c)))failures.push('五色格式異常 '+p.id)}
const a=DB.palettes.filter(p=>p.source==='colorbrewer').length,b=DB.palettes.filter(p=>p.source==='carto').length;
if(a!==35||b!==28||unique.size!==291)failures.push('來源數或 HEX 數量不符預期');
